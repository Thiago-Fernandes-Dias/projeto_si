services:
  postgres:
    image: postgres:17-alpine
    container_name: projeto-si-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projeto_si}
      POSTGRES_USER: ${POSTGRES_USER:-projeto_si}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projeto_si_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./projeto-si-backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projeto_si} -d ${POSTGRES_DB:-projeto_si}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      keystroke-network:
        aliases:
          - db
          - backend-db
          - ml-db
    restart: unless-stopped

  backend:
    build:
      context: ./projeto-si-backend
      dockerfile: Dockerfile
    container_name: projeto-si-backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DEBUG_LOGS: ${DEBUG_LOGS:-true}
      ASPNETCORE_HTTP_PORTS: "5000"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-projeto_si};Username=${POSTGRES_USER:-projeto_si};Password=${POSTGRES_PASSWORD:-projeto_si_dev}
      Banco__AplicarMigracoesNaInicializacao: "true"
      Jwt__Chave: ${JWT_SECRET_KEY:-chave-apenas-para-desenvolvimento-nao-usar-em-producao-0123456789}
      Biometria__MlApiUrl: http://ml-api:8000
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      keystroke-network:
        aliases:
          - mock-api
    restart: unless-stopped

  ml-api:
    build:
      context: ./projeto_si_ml_api
      dockerfile: Dockerfile
    container_name: projeto-si-ml-api
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      BIOMETRICS_DEBUG_LOGS: ${BIOMETRICS_DEBUG_LOGS:-${DEBUG_LOGS:-true}}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api,ml-api}
      DATABASE_URL: postgres://${POSTGRES_USER:-projeto_si}:${POSTGRES_PASSWORD:-projeto_si_dev}@postgres:5432/${POSTGRES_DB:-projeto_si}
      BIOMETRICS_MODELS_DIR: /app/models_data
    ports:
      - "${ML_API_PORT:-8000}:8000"
    volumes:
      - ml_models_data:/app/models_data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      keystroke-network:
        aliases:
          - api
    restart: unless-stopped

  ml-scheduler:
    build:
      context: ./projeto_si_ml_api
      dockerfile: Dockerfile
    container_name: projeto-si-ml-scheduler
    command: ["sh", "-c", "python manage.py migrate --fake-initial --noinput && python manage.py run_scheduler"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      BIOMETRICS_DEBUG_LOGS: ${BIOMETRICS_DEBUG_LOGS:-${DEBUG_LOGS:-true}}
      DATABASE_URL: postgres://${POSTGRES_USER:-projeto_si}:${POSTGRES_PASSWORD:-projeto_si_dev}@postgres:5432/${POSTGRES_DB:-projeto_si}
      BIOMETRICS_MODELS_DIR: /app/models_data
    volumes:
      - ml_models_data:/app/models_data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keystroke-network
    restart: unless-stopped

  frontend:
    build:
      context: ./projeto_si_frontend
      dockerfile: Dockerfile
    container_name: projeto-si-frontend
    environment:
      DEBUG_LOGS: ${DEBUG_LOGS:-true}
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
      - ml-api
    networks:
      - keystroke-network
    restart: unless-stopped

volumes:
  postgres_data:
  ml_models_data:

networks:
  keystroke-network:
    name: keystroke-network
    driver: bridge
